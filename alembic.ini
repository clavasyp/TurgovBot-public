# Alembic configuration for database migrations

[alembic]
# Migration scripts directory
script_location = alembic

# Migration file naming template: revision_date_slug.py
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(slug)s

# Migration file encoding
output_encoding = utf-8

# SQLAlchemy URL is provided from environment variables in env.py
sqlalchemy.url =

# Prepend sys.path for imports
prepend_sys_path = .

# Timezone used by Alembic
timezone = UTC

[post_write_hooks]
# Optional autoformat after migration generation
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

